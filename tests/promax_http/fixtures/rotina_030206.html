                   function DisplayLoopXML(){
                       var arqXML = "../tmp/work/F7367_221_0003_l5Ew0L74174049"+".xml";
                       document.all.dsXML.async = false;
                       if( ! document.all.dsXML.load( arqXML ) ){

                           if( codErroXML == -2146697210 ){    //Arquivo ainda não existe

                           }
                           if( codErroXML == -2146697208||codErroXML == -1072896680){    //Qdo o load-XML ocorre exatamente qdo o sistema gera o arquivo (LOCK)
                               return( "..." );
                           }
                           return( "Erro [status: " + codErroXML + "] ao carregar 'F7367_221_0003_l5Ew0L74174049"+".xml'" );
                       }
                       if( document.all.dsXML.selectSingleNode( "processo" ) == null ){
                           return( "Nenhum processo foi encontrado" );
                       }
                       var oItensProcesso = document.all.dsXML.documentElement.getElementsByTagName( "ITEM" );
                       var oItem = oItensProcesso.nextNode;
                       return( oItem.getAttributeNode( "chave" ).value );
                   }
                   function DisplayLoop(){
                       var objDsp = document.all.displayLoop;
                       if( objDsp.value == '' ){
                           objDsp.value = 'Iniciando...';
                           setTimeout( 'DisplayLoop();', 2000 );
                           return;
                       }
                       if( objDsp.value == 'FIM' ){
                           objDsp.value = '';
                           return;
                       }
                       objDsp.value = DisplayPlus( objDsp, DisplayLoopXML() );
                       setTimeout( 'DisplayLoop();', 5000 );
                   }
                   function DisplayPlus( objDsp, strDsp ){
                       var nCount = parseInt( ( objDsp.value ).substr( 0, 1 ), 10 );
                       if( isNaN( nCount ) ){ nCount = 0; }
                       nCount += 1;
                       return( nCount + "-" + strDsp );
                   }

                   function EmissaoFinal( fnCallback ){
                       diaM = '17';
                       mesM = '11';
                       anoM = '2026';
                       diaF = document.all.emissaoFinal.value.substring(0,2);
                       mesF = document.all.emissaoFinal.value.substring(3,5);
                       anoF = document.all.emissaoFinal.value.substring(6,10);
                       dataMovimento = anoM + mesM + diaM;
                       dataFinal = anoF + mesF + diaF;
                       if( dataFinal > dataMovimento ){
                           msgbxSimNao( 'PW04420R' , 'Emissão final maior que data do movimento. Confirma?',
                           function(){ //Sim
                               fnCallback();
                           }
                           ,
                           function() { //Nao
                           });
                           return false;
                       }
                       fnCallback();
                   }
                   function ValidaDataRel( item ){
                       if( document.all ( item + 'inicial' ).value == '00/00/0000' && document.all ( item + 'final' ).value == '99/99/9999' ){
                           return true;
                       }
                       if( document.all ( item + 'inicial' ).value != '00/00/0000' ){
                           if( !ValidaData( document.all ( item + 'inicial' ).value, "DD/MM/YYYY" ) ){
                               document.all ( item + 'inicial' ).select();
                               document.all ( item + 'inicial' ).focus();
                               return false;
                           }
                       }
                       if( document.all ( item + 'final' ).value != '99/99/9999' ){
                           if( !ValidaData( document.all ( item + 'final' ).value, "DD/MM/YYYY" ) ){
                               document.all ( item + 'final' ).select();
                               document.all ( item + 'final' ).focus();
                               return false;
                           }
                       }
                       dataI = document.all ( item + 'inicial' ).value;
                       dataF = document.all ( item + 'final' ).value;
                       diaI = dataI.substring(0,2);
                       mesI = dataI.substring(3,5);
                       anoI = dataI.substring(6,10);
                       diaF = dataF.substring(0,2);
                       mesF = dataF.substring(3,5);
                       anoF = dataF.substring(6,10);
                       dataInicial = anoI + mesI + diaI;
                       dataFinal = anoF + mesF + diaF;
                       if( dataInicial > dataFinal ){
                           alert( 'Emissão inicial maior que final' );
                           document.all ( item + 'inicial' ).select();
                           document.all ( item + 'inicial' ).focus();
                           return false;
                       }
                       return true;
                   }
