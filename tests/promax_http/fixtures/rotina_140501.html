                  document.all.opcaoRel.focus();
                  function ValidaParRel(){
                     if(! ValidaCampos() ){
                         return false;
                     }
                     if(! ComparaValor('iniFornecedor','fimFornecedor','Fornecedor') ){
                         return false;
                     }
                     if(! ComparaValor('iniPortador','fimPortador','Portador') ){
                         return false;
                     }
                     if(! ComparaValor('iniEspecie','fimEspecie','Espécie') ){
                         return false;
                     }
                     if(! ComparaValor('iniVinculo','fimVinculo','Vínculo') ){
                         return false;
                     }
                     return true;
                  }
                   function VerificaOpcao(){
                       if( document.all.idListaPrevTodas.checked == true ){
                           document.all.idListaPrevPendAprov.checked = false;
                           document.all.idListaPrevAprovadas.checked = false;
                           document.all.idListaPrevRejeitadas.checked = false;
                           document.all.idListaPrevPendAprov.disabled = true;
                           document.all.idListaPrevAprovadas.disabled = true;
                           document.all.idListaPrevRejeitadas.disabled = true;
                       }
                       else{
                           if( "" == "S" ){
                               document.all.idListaPrevPendAprov.disabled = false;
                               document.all.idListaPrevAprovadas.disabled = false;
                               document.all.idListaPrevRejeitadas.disabled = false;
                           }
                       }
                       if( document.all.idListaPrevPendAprov.checked == true ||
                           document.all.idListaPrevAprovadas.checked == true ||
                           document.all.idListaPrevRejeitadas.checked == true ){
                           document.all.idListaPrevTodas.checked = false;
                           document.all.idListaPrevTodas.disabled = true;
                       }
                       else{
                           document.all.idListaPrevTodas.disabled = false;
                       }
                       if( document.all.idListaPrevPendAprov.checked == true &&
                           document.all.idListaPrevAprovadas.checked == true &&
                           document.all.idListaPrevRejeitadas.checked == true ){
                           document.all.idListaPrevTodas.checked = true;
                           document.all.idListaPrevTodas.disabled = false;
                           document.all.idListaPrevPendAprov.checked = false;
                           document.all.idListaPrevAprovadas.checked = false;
                           document.all.idListaPrevRejeitadas.checked = false;
                           document.all.idListaPrevPendAprov.disabled = true;
                           document.all.idListaPrevAprovadas.disabled = true;
                           document.all.idListaPrevRejeitadas.disabled = true;
                       }
                  }
