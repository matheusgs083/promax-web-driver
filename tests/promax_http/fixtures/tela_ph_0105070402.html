                   function AbrirPesquisa( href_pesquisa, rotina, top, left, width, height, aEntrada, aSaida, scrollbars, status, toolbar, menubar, location, resizable, multiFrame ){
                       var strURL = "";
                       var topo = 220;
                       var esquerda = 166;
                       var largura = 618;
                       var altura = 260;
                       var screenParametros = "";
                       var ParametrosIN = "";
                       var ParametrosOUT = "";
                       var subSessionID = "";
                       if( scrollbars != "yes" && scrollbars != "no" )
                           scrollbars = "yes";
                       if( status != "yes" && status != "no" )
                           status = "no";
                       if( toolbar != "yes" && toolbar != "no" )
                           toolbar = "no";
                       if( menubar != "yes" && menubar != "no" )
                           menubar = "no";
                       if( location != "yes" && location != "no" )
                           location = "no";
                       if( resizable != "yes" && resizable != "no" )
                           resizable = "yes";
                       screenParametros = "scrollbars=" + scrollbars + ", " +
                                  "status=" + status + ", " +
                                  "toolbar=" + toolbar + ", " +
                                  "menubar=" + menubar + ", " +
                                  "location=" + location + ", " +
                                  "resizable=" + resizable;
                       if( top > 0 )
                           topo = top;
                       if( left > 0 )
                           esquerda = left;
                       if( width > 0 )
                           largura = width;
                       if( height > 0 )
                           altura = height;
                       for( Count = 0; Count < aEntrada.length; Count++ ) {
                           cTMP = Count + 1;
                           ParametrosIN = ParametrosIN + "cE" + cTMP + "=" + aEntrada[Count] + "&";
                       }
                       for( Count = 0; Count < aSaida.length; Count++ ) {
                           cTMP = Count + 1;
                           ParametrosOUT = ParametrosOUT + "cS" + cTMP + "=" + aSaida[Count] + "&";
                       }
                       if( rotina.substring(0, 2) == "PH" ){
                           try{
                               subSessionID = $("#SubSessionID").val();
                           }catch(e){
                               subSessionID = MontaSessionJS();
                           }
                       }
                       else{
                           subSessionID = MontaSessionJS();
                       }
                       if( multiFrame != undefined && multiFrame.toUpperCase() == 'MULTI-FRAME' ){
                           if( ( ParametrosIN + ParametrosOUT ).length > 500 ){
                               alert('Excesso de parâmetros na chamada');
                           }
                           var textoReplace = ParametrosIN + ParametrosOUT + 'SubSessionID=' + subSessionID;
                           strURL = href_pesquisa + '&call=' + rotina + '&parMultiFrame=' + textoReplace.replace(/&/g, '¤');
                       }
                       else {
                           strURL = href_pesquisa + '&call=' + rotina + '&SubSessionID=' + subSessionID + "&" + ParametrosIN + ParametrosOUT;
                       }
                       try{
                           var maxWin = aJanelas.length;
                       }
                       catch( e ){
                           aJanelas = new Array();
                       }
                       aJanelas[aJanelas.length] = window.open( strURL, rotina, "top=" + topo + ", left=" + esquerda + ", width=" + largura + ", height=" + altura + ", " + screenParametros );
                       aJanelas[aJanelas.length -1].focus();
                       return false;
                   }
