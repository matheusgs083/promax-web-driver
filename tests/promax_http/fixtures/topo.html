                <SCRIPT>
                    var strClasseSel = 'comboMCD_sel';
                    var strClasseNrm = 'comboMCD';
                    var strClasseAux = strClasseNrm;
                    function TrocaEmpresa( strUnidade ){
                        document.parentWindow.parent.formFrames.unidade.value = strUnidade;
                        document.parentWindow.parent.formFrames.changeUNB.value = "A";
                        if( '0' == '1' ){
                           document.parentWindow.parent.formFrames.SessionID.value = MontaSessionID();
                        }
                        else{
                           document.parentWindow.parent.formFrames.SessionID.value = 'xxxxxxxxxxxxxxxyxxxxxxxxxxxxx'.replace(/[xy]/g, function(c) {var r = Math.random()*16|0,v=c=='x'?r: r&0x3|0x8;return v.toString(16);});
                        }
                        document.parentWindow.parent.formFrames.submit();
                    }
                    function Seleciona( tipo, obj ){
                        if( tipo == 1 ){
                            obj.className = strClasseSel;
                        }
                        else{
                            obj.className = strClasseNrm;
                        }
                    }
                    function evOnClick(){
                        strClasseNrm = strClasseSel;
                    }
                    function evOnBlur( obj ){
                        strClasseNrm = strClasseAux;
                        Seleciona( 2, obj );
                    }
                </SCRIPT>
                <SCRIPT>
                   function MontaSessionID(){
                       var Rnd1 = Math.random();
                       var con=["b", "c", "d", "f", "g", "h", "j", "k", "l", "m", "n", "p", "q", "r", "s", "t", "v", "y", "x", "z", "w"];
                       var num=["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"];
                       var vog=["a", "e", "i", "o", "u", "A", "E", "I", "O", "U", "C", "K", "I", "J", "K", "L"];
                       var lcon = con.length;
                       var lnum = num.length;
                       var lvog = vog.length;
                       var rcon1 = (Math.floor(Rnd1 * lcon));
                       var rnum1 = (Math.floor(Rnd1 * lnum));
                       var rvog1 = (Math.floor(Rnd1 * lvog));
                       var Rnd2 = Math.random();
                       var rcon2 = (Math.floor(Rnd2 * lcon));
                       var rnum2 = (Math.floor(Rnd2 * lnum));
                       var rvog2 = (Math.floor(Rnd2 * lvog));
                       var senha = con[rcon1] + num[rnum1] + vog[rvog1] + con[rcon2] + num[rnum2] + vog[rvog2];
                       var Rnd3= Math.random() + 0.2;
                       var MyValue = parseInt("67891346" * Rnd3);
                       return (senha + MyValue);
                   }
                </SCRIPT>
