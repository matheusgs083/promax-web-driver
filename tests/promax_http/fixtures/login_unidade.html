                   <SCRIPT>
                       function MontaSessionID(){
                           var Rnd1 = Math.random();
                           var con=["b", "c", "d", "f", "g", "h", "j", "k", "l", "m", "n", "p", "q", "r", "s", "t", "v", "y", "x", "z", "w"];
                           var num=["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"];
                           var vog=["a", "e", "i", "o", "u", "A", "E", "I", "O", "U", "C", "K", "I", "J", "K", "L"];
                           var lcon = con.length;
                           var lnum = num.length;
                           var lvog = vog.length;
                           var rcon1 = (Math.floor(Rnd1 * lcon));
                           var rnum1 = (Math.floor(Rnd1 * lnum));
                           var rvog1 = (Math.floor(Rnd1 * lvog));
                           var Rnd2 = Math.random();
                           var rcon2 = (Math.floor(Rnd2 * lcon));
                           var rnum2 = (Math.floor(Rnd2 * lnum));
                           var rvog2 = (Math.floor(Rnd2 * lvog));
                           var senha = con[rcon1] + num[rnum1] + vog[rvog1] + con[rcon2] + num[rnum2] + vog[rvog2];
                           var Rnd3= Math.random() + 0.2;
                           var MyValue = parseInt("67891346" * Rnd3);
                           SessionID = (senha + MyValue);
                           document.all.SessionID.value = SessionID
                           if(document.location.href.substring(0,16) == "http://127.0.0.1"){
                               if(document.location.href.substring(16,17) == ":"){
                                   animPath = document.location.href.substring(0,27)
                               }else{
                                   animPath = document.location.href.substring(0,24)
                               }
                               document.all.Animate.value = 0
                               document.all.animpath.value = ""
                           }
                           if(document.all.Usuario.value.toUpperCase() == "IMPLANTACAO"){
                               document.frmLogin.ppopcao.value = 11
                               document.frmLogin.call.value = "PW999"
                           }
                           document.all.Usuario.disabled = false
                       }
                       function Config(){
                           if(window.confirm( "Este processo desconecta TODOS os usuários, e não permite conexão até o fim da execução, continua?" ) == true){
                               document.frmLogin.ppopcao.value = 11
                               document.frmLogin.call.value = "PW999"
                               document.frmLogin.submit()
                           }
                       }
