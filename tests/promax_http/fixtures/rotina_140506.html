                  }

                 <SCRIPT>
                     document.all.opcaoRel.focus();

                     function CarregaCampo(){
                        if( document.all.preferencias1.value == '' ){
                            document.all.nomeCodigo.innerHTML = " ";
                            document.all.iniDat.disabled = true;
                            document.all.fimDat.disabled = true;
                            document.all.iniDat.className = 'clsDisabled';
                            document.all.fimDat.className = 'clsDisabled';
                            return true;
                        }
                        if( document.all.preferencias1.value == 'C' ){
                            document.all.nomeCodigo.innerHTML = "Data Contábil";
                            document.all.iniDat.disabled = false;
                            document.all.fimDat.disabled = false;
                            document.all.iniDat.className = 'campo';
                            document.all.fimDat.className = 'campo';
                            return true;
                        }
                        if( document.all.preferencias1.value == 'M' ){
                            document.all.nomeCodigo.innerHTML = "Data Movimento";
                            document.all.iniDat.disabled = false;
                            document.all.fimDat.disabled = false;
                            document.all.iniDat.className = 'campo';
                            document.all.fimDat.className = 'campo';
                            return true;
                        }
                     }
                     function HabilitaQuebraPg(){
                        if( document.all.opcaoRel.value == '03' ){
                            document.all.quebraPagina.disabled = false;
                        }
                        else{
                            document.all.quebraPagina.disabled = true;
                        }
                     }
                     function ValidaParRel(){
                        if( !ValidaCampos() ){
                            return false;
                        }
                        if( !ComparaValor( "iniCli", "fimCli", "Fornecedor" ) ){
                             document.all.iniCli.select();
                             document.all.iniCli.focus();
                             return false;
                        }
                        if( DataMaior( document.all.iniDat.value, document.all.fimDat.value ) ){
                            alert( 'Data inicial maior que final' );
                            document.all.iniDat.select();
                            return false;
                        }
                        if( DataMaior( document.all.iniEmi.value, document.all.fimEmi.value ) ){
                            alert( 'Data inicial maior que final' );
                            document.all.iniEmi.select();
                            return false;
                        }
                        if( !ComparaValor( "iniPor", "fimPor", "Portador" ) ){
                             document.all.iniPor.select();
                             document.all.iniPor.focus();
                             return false;
                        }
                        if( !ComparaValor( "iniEsp", "fimEsp", "Espécie" ) ){
                             document.all.iniEsp.select();
                             document.all.iniEsp.focus();
                             return false;
                        }
                        if( !ComparaValor( "iniVin", "fimVin", "Vínculo" ) ){
                             document.all.iniVin.select();
                             document.all.iniVin.focus();
                             return false;
                        }
                        document.all.filaimpressao.value = 0;
                        return true;
                     }

                     document.all.fimCli.value = '999999';
