               <script>
                   function VerificaPeriodo(){
                       document.all.lnOpcaoDiario.style.display = "none";
                       document.all.lnOpcaoMensal.style.display = "none";
                       document.all.lnOpcaoAnual.style.display = "none";
                       document.all.dtInicial.value = "";
                       document.all.dtFinal.value = "";
                       switch( document.all.idPeriodo.value ){
                           case "D":
                               document.all.lnOpcaoDiario.style.display = "";
                               document.all.dtInicial.value = "00/00/0000";
                               document.all.dtFinal.value = "99/99/9999";
                               break;
                           case "M":
                               document.all.lnOpcaoMensal.style.display = "";
                               break;
                           case "A":
                               document.all.lnOpcaoAnual.style.display = "";
                               break;
                       }
                   }
                   function CarregaPeriodo(){
                      var qtdCombo = document.all.idPeriodo.length;
                      for( i = 0; i < qtdCombo; i++ ){
                           document.all.idPeriodo.remove( 0 );
                      }
                      if( document.all.visao.value == "01" ){
                          IncluiPeriodo ( 'D', 'Diário' );
                      }
                      IncluiPeriodo ( 'M', 'Mensal' );
                      IncluiPeriodo ( 'A', 'Anual' );
                      document.all.idPeriodo.value = 'M';
                      VerificaPeriodo();
                   }
                   function SalvaItem( cod ){
                       document.all [ 'lista' + cod ].value = '';
                       var aux = '';
                       var result = '';
                       var tamanho = 4;
                       if( cod == "Nbz" ){
                           tamanho = 2;
                       }
                       else{
                           if( cod == "Conta" ){
                               tamanho = 10;
                           }
                       }
                       for( i = 0; i < document.all [ 'cd' + cod + 'Lista' ].length; i++ ){
                            aux = document.all [ 'cd' + cod + 'Lista' ][i].value;
                            if( aux.length != tamanho ){
                                aux = Replicate( 0, tamanho - aux.length ) + aux;
                            }
                            result = result + aux;
                       }
                       document.all [ 'lista' + cod ].value = result;
                       if( result == '' ){
                           return false;
                       }
                       else{
                           return true;
                       }
                   }
     //            Adiciona NBZ e atualiza combo de departamentos
                   function AdicionaNbz(){
                       if( AdicionaItemLista( 'Nbz' ) ){
                           SalvaItem( 'Nbz' );
                           limInd = document.all.cdDepto.length;
                           for( i = 0; i < limInd; i++ ){
                                document.all.cdDepto.remove( 0 );
                           }
                           Disabled( 'blocoDepto', true );
                           document.all.opcao.value = 2;
                           EnviarFormulario();
                       }
                   }
     //            Adiciona departamento
                   function AdicionaDepto(){
                       AdicionaItemLista( 'Depto' );
                   }

                           SalvaItem( 'Pacote' );                                      //*>AJ030105:28838
                           limInd = document.all.cdVbz.length;                         //*>AJ030105:28838
                           for( i = 0; i < limInd; i++ ){                              //*>AJ030105:28838
                                document.all.cdVbz.remove( 0 );                        //*>AJ030105:28838
                           }                                                           //*>AJ030105:28838
                           Disabled( 'blocoVbz', true );
                           document.all.opcao.value = 3;                               //*>AJ030105:28838

                           for( i = 0; i < limInd; i++ ){                              //*>AJ030105:28838
                                document.all.cdConta.remove( 0 );                      //*>AJ030105:28838
                           }                                                           //*>AJ030105:28838
                           Disabled( 'blocoConta', true );

     //            Adiciona NBZ/Depto/Pacote/VBZ/Conta na lista
                   function AdicionaItemLista( cod ){
                      var nMaxElementos = 15;
                      if( document.all [ 'cd' + cod + 'Lista' ].length >= nMaxElementos
                      && document.all.controleMensagem.value != 1 ){
                          alert( 'Todos os itens já foram adicionados' );
                          document.all.controleMensagem.value = 1;
                          return false;
                      }
                      else{
                          document.all.controleMensagem.value = 2;
                      }
                      if( document.all [ 'cd' + cod ].value == 0 ){
                          return false;
                      }
                      if( document.all [ 'cd' + cod ].value != '' ){
                          if( ItemExistente( cod ) ){
                              if( cod == "Vbz" || cod == "Conta" ){
                                  alert( cod + ' já adicionada à lista' );
                              }
                              else{
                                  alert( cod + ' já adicionado à lista' );
                              }
                              document.all [ 'cd' + cod ].focus();
                              return false;
                          }
                          Inclui( document.all [ 'cd' + cod ].value, cod );
                      }
                      document.all [ 'cd' + cod + 'Lista' ].value = document.all [ 'cd' + cod ].value;
                      document.all [ 'cd' + cod ].value = '';
                      document.all [ 'cd' + cod ].focus();
                      return true;                                                     //*>AJ030105:28838
                   }
                   function Inclui( i, cod ){
                       indice = document.all [ 'cd' + cod ].selectedIndex;
                       oOption = document.createElement( 'OPTION' );
                       oOption.value = i;
                       oOption.text = document.all [ 'cd' + cod ].item( indice ).text;
                       document.all [ 'cd' + cod + 'Lista' ].add( oOption );
                       document.all [ 'cd' + cod + 'Lista' ].size = document.all [ 'cd' + cod + 'Lista' ].size + 1;
                       oOption = null;
                   }
                   function IncluiPeriodo( valor, desc ){
                       indice = document.all.idPeriodo.length;
                       indice++;
                       oOption = document.createElement( 'OPTION' );
                       oOption.value = valor;
                       oOption.text = desc;
                       document.all.idPeriodo.add( oOption );
                       oOption = null;
                   }
     //            Verifica se Nbz/Depto/Pacote/Vbz já existe na lista
                   function ItemExistente( cod ){
                      var campo = parseInt( document.all [ 'cd' + cod ].value,10 );
                      for( i = 0; i < document.all [ 'cd' + cod + 'Lista' ].length; i++ ){
                          if( document.all [ 'cd' + cod + 'Lista' ][i].value == campo ){
                              return true;
                          }
                      }
                   }

                   function RemoverNbz(){
                       if( RemoverItem( 'Nbz' ) ){
                           SalvaItem( 'Nbz' );
                           limInd = document.all.cdDepto.length;

     //            Remove Nbz/Depto/Pacote/Vbz/Conta na lista
                   function RemoverItem( cod ){
                      var xRemover = document.all [ 'cd' + cod + 'Lista' ].value;
                      if( document.all [ 'cd' + cod + 'Lista' ].selectedIndex < 0 ){
                          alert( 'Nenhum item selecionado' );
                          document.all [ 'cd' + cod + 'Lista' ].focus();
                          return false;
                      }
                      for( i = 0; i < document.all [ 'cd' + cod + 'Lista' ].length; i++ ){
                          if( document.all [ 'cd' + cod + 'Lista' ][i].value == xRemover ) {
                              nIndice = i;
                              break;
                          }
                      }
                      document.all [ 'cd' + cod + 'Lista' ].remove( nIndice );
                      if( document.all [ 'cd' + cod + 'Lista' ].length != nIndice ){
                          document.all [ 'cd' + cod + 'Lista' ].selectedIndex = nIndice;
                      }
                      else{
                          document.all [ 'cd' + cod + 'Lista' ].selectedIndex = nIndice - 1;
                      }
                      if( document.all [ 'cd' + cod + 'Lista' ].length <= 0 ){
                          document.all [ 'cd' + cod ].focus();
                      }
                      return true;                                                     //*>AJ030105:28838
                   }
                   function ValidaSelecoes(){
                      if( !SalvaItem( 'Nbz' ) ){
                          alert( 'Informação inválida' );
                          document.all.cdNbz.focus();
                          return false;
                      }
                      if( !SalvaItem( 'Depto' ) ){
                          alert( 'Informação inválida' );
                          document.all.cdDepto.focus();
                          return false;
                      }
                      if( !SalvaItem( 'Pacote' ) ){
                          alert( 'Informação inválida' );
                          document.all.cdPacote.focus();
                          return false;
                      }
                      if( !SalvaItem( 'Vbz' ) ){
                          alert( 'Informação inválida' );
                          document.all.cdVbz.focus();
                          return false;
                      }
                      if( !SalvaItem( 'Conta' ) ){
                          alert( 'Informação inválida' );
                          document.all.cdConta.focus();
                          return false;
                      }
                      document.all.opcao.value = 5;
                      EnviarFormulario();
                   }
                   function ValidaParRel(){
                       if( !ValidaCampos() ){
                           return false;
                       }
                       switch( document.all.idPeriodo.value ){
                           case "D":
                               if( !ValidaCampos( 'obrOpcaoDiario' ) ){
                                   return false;
                               }
                               if( DataMaior( document.all.dtInicial.value, document.all.dtFinal.value ) ){
                                   alert( 'Data inicial maior que data final' );
                                   document.all.dtInicial.select();
                                   return false;
                               }
                               break;
                           case "M":
                               if( !ValidaCampos( 'obrOpcaoMensal' ) ){
                                   return false;
                               }
                               break;
                           case "A":
                               if( !ValidaCampos( 'obrOpcaoAnual' ) ){
                                   return false;
                               }
                               break;
                       }
                       SalvaItem( 'Nbz' );
                       SalvaItem( 'Depto' );
                       SalvaItem( 'Pacote' );
                       SalvaItem( 'Vbz' );
                       SalvaItem( 'Conta' );
                       return true;
                   }
