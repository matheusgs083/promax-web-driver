            <script>
                  var rtInicial = '';
                  var rtFinal = '';
                  var rtInicialLength = '';
                  var rtFinalLength = '';
                  HabilitaCheckbox();
                  function ValidaParRel(){
                      FormataCampo( document.all.dataInicial, '99/99/9999' );
                      FormataCampo( document.all.dataFinal, '99/99/9999' );
                      if( !ValidaCampos() ){
                          return false;
                      }
                      if( DataMaior( document.all.dataInicial.value, document.all.dataFinal.value ) ){
                          alert( 'Data inicial maior que data final' );
                          document.all.dataInicial.select();
                          return false;
                      }
                      if( !ComparaValor( 'veiculoInicial', 'veiculoFinal', 'Veículo' ) ){
                          return false;
                      }
                      rtInicialLength = document.all.rtInicial.value;
                      rtFinalLength = document.all.rtFinal.value;
                      rtInicial = Replicate( "0" , 20 - rtInicialLength.length) + document.all.rtInicial.value;
                      rtFinal = Replicate( "0" , 20 - rtFinalLength.length) + document.all.rtFinal.value;
                      document.all.rtInicialh.value = rtInicial;
                      document.all.rtFinalh.value = rtFinal;
                      return true;
                  }
            </script>
