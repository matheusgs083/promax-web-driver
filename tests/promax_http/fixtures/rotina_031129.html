            <script>
                  function ValidaParRel(){
                     if( !ValidaCampos() ){
                         return false;
                     }
                     if (DataMaior(document.all.dataInicial.value, document.all.dataFinal.value)){
                         alert ('Data inicial maior que final');
                         document.all.dataInicial.select();
                         document.all.dataInicial.focus();
                         return false;
                     }
                     if( document.all.opcaoRel.value != 2 ){
                         if( !ComparaValor( 'mapaInicial', 'mapaFinal', 'Mapa' ) ){
                             return false;
                         }
                         if( document.all.placaInicial.value > document.all.placaFinal.value ){
                             alert( 'Informação inválida' );
                             document.all.placaFinal.focus();
                             document.all.placaFinal.select();
                             return false;
                         }
                         if( !ComparaValor( 'regiaoInicial', 'regiaoFinal', 'Região' ) ){
                             return false;
                         }
                         if( !ComparaValor( 'campoInicial', 'campoFinal', document.all.opcaoRel[ document.all.opcaoRel.selectedIndex ].text ) ){
                             return false;
                         }
                     }
                     return true;
                  }
